openapi: 3.1.0
info:
  title: AutoLife API
  version: 0.1.0
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Service can access its application schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Service cannot access its application schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          enum: [ok, ready]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            fields: {type: array, items: {type: string}}
            request_id: {type: string}
