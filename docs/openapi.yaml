openapi: 3.1.0
info:
  title: AutoLife API
  version: 0.1.0
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200':
          description: Service can access its application schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Service cannot access its application schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/csrf:
    get:
      operationId: getAccountCSRF
      parameters:
      - name: pre
        in: query
        schema:
          const: '1'
        description: Issue a pre-auth context even when signed in.
      responses:
        '200':
          description: Token for the active session or a short-lived pre-auth context
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - csrf_token
                properties:
                  csrf_token:
                    type: string
                    pattern: ^[A-Za-z0-9_-]{43}$
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/register:
    post:
      operationId: registerAccount
      description: Requires an unexpired pre-auth cookie and its CSRF token.
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 256
      responses:
        '202':
          description: Generic acceptance
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/verify:
    post:
      operationId: verifyAccountEmail
      description: Requires an unexpired pre-auth cookie and its CSRF token.
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - token
              properties:
                token:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
      responses:
        '204':
          description: Email verified
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      operationId: loginAccount
      description: Requires an unexpired pre-auth cookie and its CSRF token.
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 256
      responses:
        '200':
          description: Session cookie set
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - id
                - email
                properties:
                  id:
                    type: string
                    format: uuid
                  email:
                    type: string
                    format: email
                    maxLength: 254
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/logout:
    post:
      operationId: logoutAccount
      security:
      - session: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Current session revoked
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/password/forgot:
    post:
      operationId: requestPasswordReset
      description: Requires an unexpired pre-auth cookie and its CSRF token.
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '202':
          description: Generic acceptance
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/password/reset:
    post:
      operationId: resetAccountPassword
      description: Requires an unexpired pre-auth cookie and its CSRF token.
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - token
              - new_password
              properties:
                token:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
                new_password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 256
      responses:
        '204':
          description: Password reset and all sessions revoked
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/password/change:
    post:
      operationId: changeAccountPassword
      security:
      - session: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 256
                new_password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 256
      responses:
        '204':
          description: Password changed, current cookie rotated and other sessions revoked
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me:
    get:
      operationId: getOwnAccountProfile
      security:
      - session: []
      responses:
        '200':
          description: Current account settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      operationId: patchOwnAccountProfile
      security:
      - session: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                locale:
                  enum:
                  - ru
                  - en
                timezone:
                  type: string
                  maxLength: 128
                theme:
                  enum:
                  - system
                  - light
                  - dark
                notifications:
                  type: boolean
                analytics_consent:
                  type: boolean
      responses:
        '200':
          description: Updated account settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: requestAccountDeletion
      security:
      - session: []
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - confirm
              properties:
                confirm:
                  const: true
                current_password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 256
      responses:
        '202':
          description: Deletion durably accepted or receipt replayed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - id
                properties:
                  id:
                    type: string
                    format: uuid
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/sessions:
    get:
      operationId: listOwnSessions
      security:
      - session: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Active sessions without credentials
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccountSession'
                  next_cursor:
                    type: string
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/sessions/{id}:
    delete:
      operationId: revokeOwnSession
      security:
      - session: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Owned session revoked
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/export:
    post:
      operationId: requestOwnExport
      security:
      - session: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                current_password:
                  type: string
                  format: password
                  minLength: 12
                  maxLength: 256
      responses:
        '202':
          description: Export durably accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - id
                properties:
                  id:
                    type: string
                    format: uuid
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/exports/{id}:
    get:
      operationId: getOwnExport
      security:
      - session: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Owner-scoped export status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - id
                - state
                - requested_at
                properties:
                  id:
                    type: string
                    format: uuid
                  state:
                    enum:
                    - requested
                    - running
                    - ready
                    - failed
                    - expired
                  requested_at:
                    type: string
                    format: date-time
                  expires_at:
                    type: string
                    format: date-time
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/exports/{id}/download:
    post:
      operationId: issueOwnExportLink
      security:
      - session: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Origin
        in: header
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Download link tied to the requesting session and expiring within
            five minutes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - url
                properties:
                  url:
                    type: string
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/me/exports/{id}/content:
    get:
      operationId: downloadOwnExport
      security:
      - session: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ticket
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Private JSON attachment
          content:
            application/json:
              schema:
                type: object
        default:
          description: Request rejected or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/files:
    get:
      operationId: listFiles
      description: Requires a session. Lists unexpired ready files for the current owner.
      parameters:
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      - in: query
        name: cursor
        schema: {type: string}
      responses:
        '200':
          description: File page
          content:
            application/json:
              schema:
                type: object
                required: [files, next_cursor]
                properties:
                  files:
                    type: array
                    items: {$ref: '#/components/schemas/FileMetadata'}
                  next_cursor: {type: string}
        default: {$ref: '#/components/responses/FileError'}
    post:
      operationId: uploadFile
      description: Requires a session, Origin and CSRF. One file, 1 to 100000000 bytes. JPEG, PNG, WebP and static PDF undergo mandatory isolated inspection.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file: {type: string, format: binary}
      responses:
        '201':
          description: File inspected and ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileMetadata'}
        default: {$ref: '#/components/responses/FileError'}
  /api/v1/files/{id}:
    parameters:
    - $ref: '#/components/parameters/FileID'
    get:
      operationId: getFile
      description: Requires a session. Unavailable and foreign files return 404.
      responses:
        '200':
          description: Owner file metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileMetadata'}
        default: {$ref: '#/components/responses/FileError'}
    delete:
      operationId: deleteFile
      description: Requires a session, Origin and CSRF. Active pins return 409. Object deletion is durable and asynchronous.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      responses:
        '204':
          description: File is inaccessible and scheduled for removal
        default: {$ref: '#/components/responses/FileError'}
  /api/v1/files/{id}/download:
    parameters:
    - $ref: '#/components/parameters/FileID'
    post:
      operationId: createFileDownload
      description: Requires a session, Origin and CSRF. URL expires in at most five minutes and no later than the file.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      responses:
        '200':
          description: Private presigned attachment URL
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: {type: string, format: uri}
        default: {$ref: '#/components/responses/FileError'}
  /api/v1/actions:
    get:
      operationId: listWorkflowActions
      description: Requires a session. Returns only available action versions. Image and PDF actions require their available, isolated launcher profiles.
      responses:
        '200':
          description: Available actions
          content:
            application/json:
              schema:
                type: object
                required: [actions]
                properties:
                  actions:
                    type: array
                    items: {$ref: '#/components/schemas/WorkflowDescriptor'}
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/triggers:
    get:
      operationId: listWorkflowTriggers
      description: Requires a session.
      responses:
        '200':
          description: Available triggers
          content:
            application/json:
              schema:
                type: object
                required: [triggers]
                properties:
                  triggers:
                    type: array
                    items: {$ref: '#/components/schemas/WorkflowDescriptor'}
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/workflows:
    get:
      operationId: listWorkflows
      description: Requires a session. Lists only the current owner's workflows.
      parameters:
      - $ref: '#/components/parameters/WorkflowLimit'
      - $ref: '#/components/parameters/WorkflowCursor'
      - in: query
        name: status
        schema: {enum: [draft, active, inactive, archived]}
      responses:
        '200':
          description: Workflow page
          content:
            application/json:
              schema:
                type: object
                required: [workflows, next_cursor]
                properties:
                  workflows:
                    type: array
                    items: {$ref: '#/components/schemas/WorkflowMetadata'}
                  next_cursor: {type: string}
        default: {$ref: '#/components/responses/WorkflowError'}
    post:
      operationId: createWorkflow
      description: Requires a session, Origin and CSRF. Creates an empty draft with revision 1.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WorkflowPatch'
              - required: [name]
      responses:
        '201':
          description: New workflow and draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowDetails'}
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/workflows/{id}:
    parameters:
    - $ref: '#/components/parameters/WorkflowID'
    get:
      operationId: getWorkflow
      description: Requires a session.
      responses:
        '200':
          description: Workflow and editable draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowDetails'}
        default: {$ref: '#/components/responses/WorkflowError'}
    patch:
      operationId: updateWorkflowMetadata
      description: Requires a session, Origin and CSRF. Edits name and description.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkflowPatch'}
      responses:
        '200':
          description: Updated workflow and draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowDetails'}
        default: {$ref: '#/components/responses/WorkflowError'}
    delete:
      operationId: archiveWorkflow
      description: Requires a session, Origin and CSRF. Idempotently archives the workflow and retains versions.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      responses:
        '204':
          description: Workflow archived
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/workflows/{id}/copy:
    parameters:
    - $ref: '#/components/parameters/WorkflowID'
    post:
      operationId: copyWorkflow
      description: Requires a session, Origin and CSRF. Copies the draft into an independent workflow.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '201':
          description: Independent workflow and draft
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowDetails'}
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/workflows/{id}/draft:
    parameters:
    - $ref: '#/components/parameters/WorkflowID'
    put:
      operationId: saveWorkflowDraft
      description: Requires a session, Origin and CSRF. Saved draft definitions may be incomplete.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, definition]
              properties:
                expected_revision: {type: integer, minimum: 1}
                definition: {type: object, description: Bounded JSON draft up to 256 KiB}
      responses:
        '200':
          description: Draft with incremented revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowDraft'}
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/workflows/{id}/validate:
    parameters:
    - $ref: '#/components/parameters/WorkflowID'
    post:
      operationId: validateWorkflow
      description: Requires a session, Origin and CSRF. Checks an optional submitted definition or the saved draft without storing changes.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                definition: {type: object}
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                required: [valid, errors, warnings]
                properties:
                  valid: {type: boolean}
                  errors:
                    type: array
                    items: {$ref: '#/components/schemas/WorkflowProblem'}
                  warnings:
                    type: array
                    items: {$ref: '#/components/schemas/WorkflowProblem'}
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/workflows/{id}/versions:
    parameters:
    - $ref: '#/components/parameters/WorkflowID'
    get:
      operationId: listWorkflowVersions
      description: Requires a session. Lists published version metadata in descending order.
      parameters:
      - $ref: '#/components/parameters/WorkflowLimit'
      - $ref: '#/components/parameters/WorkflowCursor'
      responses:
        '200':
          description: Version page
          content:
            application/json:
              schema:
                type: object
                required: [versions, next_cursor]
                properties:
                  versions:
                    type: array
                    items: {$ref: '#/components/schemas/WorkflowVersion'}
                  next_cursor: {type: string}
        default: {$ref: '#/components/responses/WorkflowError'}
    post:
      operationId: publishWorkflowVersion
      description: Requires a session, Origin and CSRF. An exact draft revision can be published once.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: {type: integer, minimum: 1}
      responses:
        '201':
          description: Activated immutable version including its definition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowVersion'}
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/workflows/{id}/executions:
    parameters:
    - $ref: '#/components/parameters/WorkflowID'
    post:
      operationId: startExecution
      description: Requires a session.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecutionStart'}
      responses:
        '202':
          description: Execution request processed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionAccepted'}
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/workflows/{id}/test-executions:
    parameters:
    - $ref: '#/components/parameters/WorkflowID'
    post:
      operationId: startTestExecution
      description: Requires a session.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecutionTest'}
      responses:
        '202':
          description: Execution request processed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionAccepted'}
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/executions/{id}/retry:
    parameters:
    - $ref: '#/components/parameters/WorkflowID'
    post:
      operationId: retryExecution
      description: Requires a session.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExecutionInputs'}
      responses:
        '202':
          description: Execution request processed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionAccepted'}
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/executions/{id}/cancel:
    parameters:
    - $ref: '#/components/parameters/WorkflowID'
    post:
      operationId: cancelExecution
      description: Requires a session.
      parameters:
      - $ref: '#/components/parameters/FileOrigin'
      - $ref: '#/components/parameters/FileCSRF'
      responses:
        '202':
          description: Execution request processed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionCancel'}
        '200':
          description: Execution request processed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionCancel'}
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/executions/{id}:
    parameters:
    - $ref: '#/components/parameters/WorkflowID'
    get:
      operationId: getExecution
      description: Requires a session.
      responses:
        '200':
          description: Execution request processed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionDetails'}
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/executions:
    get:
      operationId: listExecutions
      description: Requires a session.
      parameters:
      - $ref: '#/components/parameters/WorkflowLimit'
      - $ref: '#/components/parameters/WorkflowCursor'
      - name: workflow_id
        in: query
        schema: {type: string, format: uuid}
      - name: status
        in: query
        schema: {$ref: '#/components/schemas/ExecutionState'}
      responses:
        '200':
          description: Execution request processed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionPage'}
        default: {$ref: '#/components/responses/WorkflowError'}
  /api/v1/usage:
    get:
      operationId: getExecutionUsage
      description: Requires a session.
      responses:
        '200':
          description: Execution request processed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExecutionUsage'}
        default: {$ref: '#/components/responses/WorkflowError'}
components:
  parameters:
    WorkflowID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    WorkflowLimit:
      in: query
      name: limit
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    WorkflowCursor:
      in: query
      name: cursor
      schema: {type: string, maxLength: 512}
    FileID:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    FileOrigin:
      in: header
      name: Origin
      required: true
      schema: {type: string}
    FileCSRF:
      in: header
      name: X-CSRF-Token
      required: true
      schema: {type: string}
  responses:
    WorkflowError:
      description: Safe error. Possible statuses include 400, 401, 403, 404, 409, 413, 422 and 503.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/WorkflowAPIError'}
    FileError:
      description: Safe file error. Possible statuses include 401, 403, 404, 409, 413, 415, 422, 429 and 503.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-autolife-session
      description: The loopback development cookie is named autolife-session.
  schemas:
    ExecutionState:
      enum: [queued, running, retrying, cancel_requested, succeeded, failed, cancelled, timed_out]
    ExecutionInputs:
      type: object
      properties:
        files:
          type: array
          maxItems: 50
          items: {type: string, format: uuid}
        user_inputs: {type: object}
    ExecutionStart:
      allOf:
      - $ref: '#/components/schemas/ExecutionInputs'
      - type: object
        properties:
          version_id: {type: string, format: uuid}
    ExecutionTest:
      allOf:
      - $ref: '#/components/schemas/ExecutionInputs'
      - type: object
        required: [expected_revision]
        properties:
          expected_revision: {type: integer, minimum: 1}
    ExecutionAccepted:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
    ExecutionCancel:
      allOf:
      - $ref: '#/components/schemas/ExecutionAccepted'
      - type: object
        required: [status]
        properties:
          status: {$ref: '#/components/schemas/ExecutionState'}
    Execution:
      type: object
      required: [id, workflow_id, status, queued_at, start_deadline]
      properties:
        id: {type: string, format: uuid}
        workflow_id: {type: string, format: uuid}
        version_id: {type: [string, 'null'], format: uuid}
        snapshot_id: {type: [string, 'null'], format: uuid}
        status: {$ref: '#/components/schemas/ExecutionState'}
        queued_at: {type: string, format: date-time}
        start_deadline: {type: string, format: date-time}
        started_at: {type: [string, 'null'], format: date-time}
        run_deadline: {type: [string, 'null'], format: date-time}
        terminal_at: {type: [string, 'null'], format: date-time}
        error_code: {type: [string, 'null']}
        outputs: {type: object}
    ExecutionDetails:
      allOf:
      - $ref: '#/components/schemas/Execution'
      - type: object
        required: [steps, files]
        properties:
          steps:
            type: array
            items:
              type: object
              required: [ordinal, step_id, action_type, action_version, status, attempts]
              properties:
                ordinal: {type: integer}
                step_id: {type: string}
                action_type: {type: string}
                action_version: {type: integer}
                status: {type: string}
                error_code: {type: [string, 'null']}
                attempts:
                  type: array
                  items:
                    type: object
                    required: [number, state, started_at]
                    properties:
                      number: {type: integer, minimum: 1, maximum: 3}
                      failed_index: {type: integer, minimum: 1, maximum: 50, description: One-based failed input in an image batch}
                      state: {type: string}
                      started_at: {type: string, format: date-time}
                      ended_at: {type: [string, 'null'], format: date-time}
                      error_code: {type: [string, 'null']}
          files:
            type: array
            items:
              type: object
              required: [id, role, expired]
              properties:
                id: {type: string, format: uuid}
                role: {enum: [input, output]}
                expired: {type: boolean}
    ExecutionPage:
      type: object
      required: [executions, next_cursor]
      properties:
        executions:
          type: array
          items: {$ref: '#/components/schemas/Execution'}
        next_cursor: {type: string}
    ExecutionUsage:
      type: object
      required: [active_executions, active_execution_limit, reserved_input_bytes, stored_file_bytes, reserved_upload_bytes]
      properties:
        active_executions: {type: integer}
        active_execution_limit: {type: integer}
        reserved_input_bytes: {type: integer}
        stored_file_bytes: {type: integer}
        reserved_upload_bytes: {type: integer}
    WorkflowAPIError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            fields:
              type: array
              items: {$ref: '#/components/schemas/WorkflowProblem'}
            request_id: {type: string}
    WorkflowPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: string, maxLength: 2000}
    WorkflowMetadata:
      type: object
      required: [id, name, description, status, active_version_id, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        status: {enum: [draft, active, inactive, archived]}
        active_version_id: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    WorkflowDetails:
      allOf:
      - $ref: '#/components/schemas/WorkflowMetadata'
      - type: object
        required: [draft]
        properties:
          draft: {$ref: '#/components/schemas/WorkflowDraft'}
    WorkflowDraft:
      type: object
      required: [revision, definition, updated_at]
      properties:
        revision: {type: integer, minimum: 1}
        definition: {type: object}
        updated_at: {type: string, format: date-time}
    WorkflowVersion:
      type: object
      required: [id, version, revision, schema_version, created_at]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        revision: {type: integer, minimum: 1}
        schema_version: {type: integer, minimum: 1}
        definition: {type: object}
        created_at: {type: string, format: date-time}
    WorkflowDescriptor:
      type: object
      required: [type, version, config, inputs, outputs]
      properties:
        type: {type: string}
        version: {type: integer, minimum: 1}
        config: {$ref: '#/components/schemas/WorkflowFields'}
        inputs: {$ref: '#/components/schemas/WorkflowFields'}
        outputs: {$ref: '#/components/schemas/WorkflowFields'}
        capability: {type: string}
        resource_profile: {type: string}
        max_attempts: {type: integer, minimum: 1, maximum: 3}
        format_pairs:
          type: array
          items:
            type: object
            required: [input, output]
            properties:
              input: {type: string}
              output: {type: string}
    WorkflowFields:
      type: object
      additionalProperties: {$ref: '#/components/schemas/WorkflowField'}
    WorkflowField:
      type: object
      required: [kind]
      properties:
        kind: {enum: [string, integer, number, boolean, date, datetime, object, array, file]}
        optional: {type: boolean}
        nullable: {type: boolean}
        items: {$ref: '#/components/schemas/WorkflowField'}
        properties: {$ref: '#/components/schemas/WorkflowFields'}
        formats: {type: array, items: {type: string}}
        enum: {type: array, items: {type: string}}
        max_items: {type: integer, minimum: 1, maximum: 1000}
    WorkflowProblem:
      type: object
      required: [code, path]
      properties:
        code: {type: string}
        path: {type: string, description: JSON Pointer to the invalid field}
        step_id: {type: string}
    FileMetadata:
      type: object
      required: [id, display_name, mime, bytes, state, created_at, ready_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        display_name: {type: string, maxLength: 255}
        mime: {enum: [image/jpeg, image/png, image/webp, application/pdf]}
        bytes: {type: integer, minimum: 1, maximum: 100000000}
        state: {const: ready}
        created_at: {type: string, format: date-time}
        ready_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    Health:
      type: object
      required: [status]
      properties:
        status:
          enum: [ok, ready]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, fields, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            fields: {type: array, items: {type: string}}
            request_id: {type: string}
    AccountProfile:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - locale
      - timezone
      - theme
      - notifications
      - analytics_consent
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        email_verified_at:
          type:
          - string
          - 'null'
          format: date-time
        locale:
          enum:
          - ru
          - en
        timezone:
          type: string
          maxLength: 128
        theme:
          enum:
          - system
          - light
          - dark
        notifications:
          type: boolean
        analytics_consent:
          type: boolean
        analytics_consent_updated_at:
          type:
          - string
          - 'null'
          format: date-time
    AccountSession:
      type: object
      additionalProperties: false
      required:
      - id
      - created_at
      - expires_at
      - current
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
