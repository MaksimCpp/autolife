name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    container:
      image: golang:1.27.4-alpine@sha256:70bd7ddea8b6cbe5d6943cde279d6b67feb10cc924fb9100d1d8757c1575b280
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: apk add --no-cache gcc musl-dev
      - run: test -z "$(gofmt -l .)"
      - run: go mod download && go mod verify
      - run: go vet -mod=readonly ./...
      - run: go test -mod=readonly -race ./...
      - run: go build -mod=readonly ./cmd/...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
  frontend:
    runs-on: ubuntu-24.04
    container:
      image: node:24.16.0-alpine@sha256:21f403ab171f2dc89bad4dd69d7721bfd15f084ccb46cdd225f31f2bc59b5c9a
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level high
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 git --redact /repo
  integration:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, secrets]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: infrastructure/compose/create-dev-env.sh
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - run: |
          set -a
          . ./.env
          set +a
          infrastructure/smoke/compose.sh
      - if: failure()
        run: docker compose ps -a
      - if: always()
        run: docker compose down
